<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" role="img" aria-label="害虫害獣 駆除・防除のイラスト">
  <defs>
    <linearGradient id="apShield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a7ce8"/><stop offset="1" stop-color="#1257b8"/></linearGradient>
    <linearGradient id="apDisc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f3ff"/><stop offset="1" stop-color="#d7eefc"/></linearGradient>
    <filter id="apSh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0c2a5e" flood-opacity="0.16"/></filter>
  </defs>
  <circle cx="260" cy="230" r="188" fill="url(#apDisc)"/>
  <circle cx="260" cy="230" r="188" fill="none" stroke="#bfe0f7" stroke-opacity=".6" stroke-dasharray="3 12" stroke-width="3"/>

  <!-- central shield -->
  <g filter="url(#apSh)">
    <path d="M260 110l96 34v74c0 72-46 116-96 134-50-18-96-62-96-134v-74Z" fill="url(#apShield)"/>
    <path d="M260 110l96 34v74c0 72-46 116-96 134V110Z" fill="#0c2a5e" opacity=".12"/>
    <path d="M222 232l28 28 52-58" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- pest chips kept out -->
  <g filter="url(#apSh)">
    <circle cx="86" cy="150" r="42" fill="#fff"/>
    <!-- mouse -->
    <ellipse cx="84" cy="156" rx="22" ry="14" fill="#7d8794"/>
    <circle cx="66" cy="146" r="8" fill="#7d8794"/><circle cx="62" cy="140" r="5" fill="#9aa3ad"/>
    <circle cx="64" cy="148" r="2" fill="#2c3a4f"/>
    <path d="M104 160c10 2 14 8 14 14" fill="none" stroke="#7d8794" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g filter="url(#apSh)">
    <circle cx="100" cy="318" r="40" fill="#fff"/>
    <!-- cockroach -->
    <ellipse cx="100" cy="320" rx="20" ry="13" fill="#6b4a2f"/>
    <ellipse cx="100" cy="312" rx="11" ry="8" fill="#8a6240"/>
    <path d="M88 304l-8-8M112 304l8-8M84 320h-12M128 320h-12M88 334l-8 8M112 334l8 8" stroke="#6b4a2f" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g filter="url(#apSh)">
    <circle cx="430" cy="138" r="42" fill="#fff"/>
    <!-- bee -->
    <ellipse cx="430" cy="146" rx="18" ry="22" fill="#ffb020"/>
    <path d="M430 130v32M418 138h24M420 152h20" stroke="#3a2c10" stroke-width="4"/>
    <circle cx="430" cy="120" r="9" fill="#3a2c10"/>
    <ellipse cx="414" cy="128" rx="12" ry="7" fill="#e8f1fc" opacity=".9" transform="rotate(-30 414 128)"/>
    <ellipse cx="446" cy="128" rx="12" ry="7" fill="#e8f1fc" opacity=".9" transform="rotate(30 446 128)"/>
  </g>
  <g filter="url(#apSh)">
    <circle cx="436" cy="320" r="40" fill="#fff"/>
    <!-- spray -->
    <rect x="424" y="312" width="22" height="14" rx="3" fill="#16b6c9"/>
    <rect x="431" y="304" width="8" height="8" fill="#16b6c9"/>
    <rect x="420" y="326" width="30" height="26" rx="6" fill="#1668d8"/>
    <path d="M446 308l12-4v6l-12 2Z" fill="#16b6c9"/>
  </g>

  <g fill="#ffb020"><path d="M250 56l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></g>
  <g fill="#16b6c9"><circle cx="160" cy="80" r="5"/><circle cx="372" cy="392" r="6"/></g>
</svg>
