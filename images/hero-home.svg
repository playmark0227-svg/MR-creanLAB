<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" role="img" aria-label="MR.クリーンラボのスタッフイラスト">
  <defs>
    <linearGradient id="hbUniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7ce8"/><stop offset="1" stop-color="#1257b8"/>
    </linearGradient>
    <linearGradient id="hbDisc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f3ff"/><stop offset="1" stop-color="#d7eefc"/>
    </linearGradient>
    <filter id="hbShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0c2a5e" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <circle cx="260" cy="240" r="190" fill="url(#hbDisc)"/>
  <circle cx="260" cy="240" r="190" fill="none" stroke="#bfe0f7" stroke-opacity=".6" stroke-dasharray="3 12" stroke-width="3"/>

  <!-- character: shoulders / uniform -->
  <path d="M138 470c0-86 52-130 122-130s122 44 122 130Z" fill="url(#hbUniform)"/>
  <!-- collar -->
  <path d="M214 356l46 40 46-40-20-16-26 22-26-22Z" fill="#0c2a5e"/>
  <path d="M252 372h16l-4 28h-8Z" fill="#e8f1fc"/>
  <!-- chest badge -->
  <rect x="296" y="404" width="44" height="30" rx="8" fill="#ffffff" opacity=".9"/>
  <path d="M318 410c2.6 4 3.6 5.7 3.6 7.6a3.6 3.6 0 1 1-7.2 0c0-1.9 1-3.6 3.6-7.6Z" fill="#16b6c9"/>

  <!-- neck -->
  <rect x="241" y="300" width="38" height="54" rx="15" fill="#f3c19c"/>
  <path d="M241 318c10 14 28 14 38 0v-18h-38Z" fill="#e7ad84" opacity=".5"/>
  <!-- head -->
  <circle cx="260" cy="250" r="72" fill="#f7c9a3"/>
  <!-- ears -->
  <circle cx="190" cy="252" r="13" fill="#f3c19c"/><circle cx="330" cy="252" r="13" fill="#f3c19c"/>
  <!-- face -->
  <circle cx="234" cy="252" r="6.5" fill="#2c3a4f"/>
  <circle cx="286" cy="252" r="6.5" fill="#2c3a4f"/>
  <circle cx="236.4" cy="249.6" r="2" fill="#fff"/>
  <circle cx="288.4" cy="249.6" r="2" fill="#fff"/>
  <path d="M224 238c5-5 13-5 19-1" fill="none" stroke="#b07a4e" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M277 237c6-4 14-4 19 1" fill="none" stroke="#b07a4e" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="218" cy="272" r="10" fill="#f4a98a" opacity=".55"/>
  <circle cx="302" cy="272" r="10" fill="#f4a98a" opacity=".55"/>
  <path d="M244 280c6 7 26 7 32 0" fill="none" stroke="#b07a4e" stroke-width="4" stroke-linecap="round"/>

  <!-- cap -->
  <path d="M186 232c0-46 34-78 74-78s74 32 74 78c-24-14-49-20-74-20s-50 6-74 20Z" fill="#0c2a5e"/>
  <path d="M186 232c0-46 34-78 74-78 8 0 16 1 23 3-40 6-71 38-71 84-9 1-18 5-26 11Z" fill="#123a7e"/>
  <ellipse cx="150" cy="236" rx="46" ry="17" fill="#0c2a5e"/>
  <ellipse cx="150" cy="232" rx="46" ry="15" fill="#16306a"/>
  <!-- cap logo -->
  <circle cx="260" cy="186" r="17" fill="#16b6c9"/>
  <path d="M260 176c3.4 5.3 4.8 7.6 4.8 10a4.8 4.8 0 1 1-9.6 0c0-2.4 1.4-4.7 4.8-10Z" fill="#fff"/>

  <!-- floating chips -->
  <g filter="url(#hbShadow)">
    <rect x="48" y="120" width="78" height="78" rx="20" fill="#fff"/>
    <path d="M87 142c8 12 11 17 11 22a11 11 0 1 1-22 0c0-5 3-10 11-22Z" fill="#16b6c9"/>
  </g>
  <g filter="url(#hbShadow)">
    <rect x="36" y="300" width="74" height="74" rx="20" fill="#fff"/>
    <rect x="63" y="318" width="20" height="14" rx="3" fill="#1668d8"/>
    <rect x="69" y="332" width="8" height="6" fill="#1668d8"/>
    <rect x="60" y="338" width="26" height="22" rx="5" fill="#1668d8"/>
    <path d="M83 320l12-4v6l-12 2Z" fill="#16b6c9"/>
  </g>
  <g filter="url(#hbShadow)">
    <rect x="398" y="108" width="80" height="80" rx="20" fill="#fff"/>
    <path d="M438 126l26 20v22a4 4 0 0 1-4 4h-44a4 4 0 0 1-4-4v-22Z" fill="#ff7a1a"/>
    <rect x="430" y="156" width="16" height="16" rx="2" fill="#fff"/>
  </g>
  <g filter="url(#hbShadow)">
    <rect x="410" y="296" width="76" height="76" rx="20" fill="#fff"/>
    <path d="M448 312l22 8v14c0 13-9 22-22 26-13-4-22-13-22-26v-14Z" fill="#13b07e"/>
    <path d="M438 334l7 7 14-14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffb020">
    <path d="M150 70l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/>
    <path d="M392 232l2.4 5.6 5.6 2.4-5.6 2.4-2.4 5.6-2.4-5.6-5.6-2.4 5.6-2.4Z"/>
  </g>
  <g fill="#16b6c9">
    <circle cx="120" cy="250" r="5"/><circle cx="406" cy="60" r="6"/><circle cx="470" cy="232" r="5"/>
  </g>
</svg>
